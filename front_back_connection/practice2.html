<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按鈕練習</title>
    <style>
        .lunch_button {
            margin: 10px;
            padding: 10px;
            font-size: 20px;
            background-color: yellow;
            cursor: pointer;
            border-radius: 5px;
            border: none;
        }

        .lunch_button:hover {
            background-color: red;
        }
    </style>
</head>

<body>
    <h1>今天午餐 : <span id="lunch"></span></h1>
    <button class="lunch_button" type="button" onclick="go()">button</button>
    <script>
        function go() {
            const option = ['beef_noodles', 'dumplins', 'Mcdonals', 'KFC']
            // 會取出一個數字
            const RandomIndex = Math.floor(Math.random() * 4)
            const answer = option[RandomIndex]
            document.getElementById("lunch").innerText = answer
            alert(`抽中${answer}`);
        }
    </script>

</body>

</html>
