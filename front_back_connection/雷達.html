<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷達</title>
    <style>
        #line{
            position: absolute;
            right: 400px;
            top:300px;
            transform-origin: left center;
            animation: radar_line 0.5s linear infinite;
        }

        @keyframes radar_line {
            0%{ transform: rotate(0deg);}
            100%{transform: rotate(360deg
                );}
        }

    </style>
</head>
<body>
    <img src="雷達線.png" id="line">
</body>
</html>
