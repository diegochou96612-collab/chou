<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>繞基準點順時針旋轉</title>
<style>
  /* 畫布與置中設定 */
  .container {
    position: relative;
    width: 400px;
    height: 400px;
    margin: 50px auto;
    border: 1px dashed #ccc; /* 參考用邊框 */
  }

  /* 藍色基準點 (Pivot Point) */
  .pivot-point {
    position: absolute;
    bottom: 100px;
    left: 200px;
    width: 20px;
    height: 20px;
    background-color: transparent;
    border: 4px solid blue;
    border-radius: 50%;
    /* 讓這個點的中心對齊座標 */
    transform: translate(-50%, 50%); 
    z-index: 2;
  }

  /* 旋轉的整體物件 (包含綠色長方形與紅色圓圈) */
  .rotating-object {
    position: absolute;
    bottom: 100px; /* 底部對齊藍色點的位置 */
    left: 200px;   /* 水平對齊藍色點的位置 */
    width: 40px;
    height: 200px;
    
    /* 將物件向左偏移自身寬度的一半，使其水平居中於藍點 */
    margin-left: -20px; 
    
    /* 綠色長方形的樣式 */
    background-color: transparent;
    border: 4px solid #27ae60;
    
    /* ★ 關鍵屬性：將旋轉中心設定在物件的底部中央 ★ */
    transform-origin: bottom center;
    
    /* 執行旋轉動畫：名稱 持續時間 線性速度 無限播放 */
    animation: spinClockwise 4s linear infinite;
    z-index: 1;
  }

  /* 頂部的紅色圓圈 (利用偽元素附加在長方形上方) */
  .rotating-object::before {
    content: '';
    position: absolute;
    top: -60px; /* 移到長方形的頂端之外 */
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    background-color: transparent;
    border: 4px solid red;
    border-radius: 50%;
  }

  /* 定義順時針旋轉的動畫關鍵影格 */
  @keyframes spinClockwise {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="pivot-point"></div>
  
  <div class="rotating-object"></div>
</div>

</body>
</html>
